# True color support — tmux-256color enables full tmux features,
# the overrides tell tmux the outer terminal (Alacritty/iTerm2) can do 24-bit color.
# Without this, nvim colorschemes look washed out.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,alacritty:Tc"

# Split panes with | and - instead of the default % and "
unbind %
bind | split-window -h
unbind '"'
bind - split-window -v

# Reload this config with prefix + r
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# Resize panes with prefix + h/j/k/l (vim directions), repeatable
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

# Toggle pane zoom (fullscreen) with prefix + m
bind -r m resize-pane -Z

# Start windows and panes at 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Click panes, drag borders, scroll with mouse
set -g mouse on

# tpm plugin manager
set -g @plugin 'tmux-plugins/tpm'

# list of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator'  # navigate panes and vim/nvim splits with Ctrl-hjkl
set -g @plugin 'tmux-plugins/tmux-resurrect'     # save/restore sessions across restarts
set -g @plugin 'tmux-plugins/tmux-continuum'     # auto-save sessions every 15 minutes
set -g @plugin 'janoamaral/tokyo-night-tmux'     # Tokyo Night status bar 
set -g @tokyo-night-tmux_show_datetime 0       # hide the date/time widget
set -g @tokyo-night-tmux_show_git 1            # show the git status widget
set -g @tokyo-night-tmux_show_path 1           # show current directory in the bar
set -g @tokyo-night-tmux_path_format relative  # as a short relative path, like "home/elliott"
set -g @tokyo-night-tmux_window_id_style dsquare  # the square-style window number pill
set -g @resurrect-capture-pane-contents 'on'  # resurrect also saves pane contents
set -g @continuum-restore 'on'                # auto-restore last session on tmux start

#set vi-mode
set-window-option -g mode-keys vi

#keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Initialize TPM (keep this at the very bottom of tmux.conf)
#
# The tmux server can start with a bare PATH that lacks the directory tmux
# itself lives in, and run-shell inherits the server's environment — so tpm's
# internal `tmux` calls fail and no plugin ever loads, silently. Repair the
# server PATH first, then run tpm in the same shell so tpm gets it too
# (setenv -g does not reach an already-running run-shell).
#
# The candidate list covers Apple Silicon brew, Intel brew and Linuxbrew. If
# tmux is somewhere else it's almost certainly a system path already on PATH,
# so the loop finds nothing and tpm just runs as-is.
run 'd=""; for c in /opt/homebrew/bin /usr/local/bin /home/linuxbrew/.linuxbrew/bin; do if [ -x "$c/tmux" ]; then d="$c"; break; fi; done; if [ -n "$d" ]; then "$d/tmux" setenv -g PATH "$d:$PATH"; PATH="$d:$PATH"; export PATH; fi; ~/.config/tmux/plugins/tpm/tpm'
