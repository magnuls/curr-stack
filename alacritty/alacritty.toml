
[general]
import = ["~/.config/alacritty/themes/themes/everforest_dark_medium.toml"]

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
size = 14.0

[window]
padding = { x = 6, y = 1 }
decorations = "Buttonless"   # delete this line if you want a normal titlebar
option_as_alt = "Both"       # makes Option behave as Alt/Meta

# Auto-attach: opens tmux session "main", creating it if it doesn't exist.
# GUI-launched Alacritty gets launchd's bare PATH (no /opt/homebrew/bin), so
# tmux is resolved through a login shell, which sources .zprofile and picks up
# brew's PATH on any machine. If tmux is missing you get a plain zsh prompt
# instead of an instantly-closing window. Delete this block to skip tmux.
[terminal.shell]
program = "/bin/zsh"
args = ["--login", "-c", "command -v tmux >/dev/null && exec tmux new-session -A -s main; exec zsh --login"]
